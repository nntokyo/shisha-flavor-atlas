name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: https://shisha-flavor-atlas.vercel.app
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: placeholder-publishable-key
